<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>华夏舆图 · 飞镖目的地 V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
</head>
<body>
  <div class="paper"></div>

  <div class="map-title">
    华夏舆图
    <small>飞 镖 旅 行 · 从 行 政 区 到 真 实 目 的 地</small>
  </div>

  <svg class="compass" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#3a2e1f" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#6b563b" stroke-width="0.6" stroke-dasharray="2 2"/>
    <path d="M50,10 L55,50 L50,90 L45,50 Z" fill="#a33a2a" stroke="#3a2e1f" stroke-width="0.8"/>
    <path d="M10,50 L50,45 L90,50 L50,55 Z" fill="#c4b18b" stroke="#3a2e1f" stroke-width="0.8"/>
    <text x="50" y="8" font-family="Ma Shan Zheng,serif" font-size="10" text-anchor="middle" fill="#3a2e1f">北</text>
    <text x="50" y="98" font-family="Ma Shan Zheng,serif" font-size="10" text-anchor="middle" fill="#3a2e1f">南</text>
    <text x="6" y="54" font-family="Ma Shan Zheng,serif" font-size="10" text-anchor="middle" fill="#3a2e1f">西</text>
    <text x="94" y="54" font-family="Ma Shan Zheng,serif" font-size="10" text-anchor="middle" fill="#3a2e1f">东</text>
    <circle cx="50" cy="50" r="3" fill="#3a2e1f"/>
  </svg>

  <div class="breadcrumb-wrap">
    <span class="breadcrumb-tassel left"></span>
    <div class="breadcrumb" id="breadcrumb"></div>
    <span class="breadcrumb-tassel right"></span>
  </div>

  <div class="controls">
    <h3>行 政 区 划</h3>
    <div class="scope-card">
      <div class="scope-label">当前区域</div>
      <div class="scope-name" id="scope-name">全国</div>
      <div class="scope-meta" id="scope-meta">等待加载边界…</div>
      <div class="scope-count" id="scope-count">0 个省级单位</div>
    </div>
    <div class="nav-actions">
      <button class="panel-btn" id="go-up">返回上一级</button>
      <button class="panel-btn secondary" id="go-home">回到全国</button>
    </div>
    <div class="region-filter" id="region-filter"></div>
    <div class="radius-tool" id="radius-tool"></div>
    <div class="hint-list">
      <div>单击区域：进入下一层</div>
      <div>区县级：发射飞镖抽取真实目的地点</div>
      <div>滚轮缩放，拖拽平移</div>
    </div>
    <div class="data-note" id="data-source">本地静态镜像</div>
  </div>

  <div class="legend" id="legend"></div>

  <button class="tweaks-toggle" id="tweaks-toggle" title="打开调参面板">调 格</button>

  <div class="tweaks" id="tweaks-panel">
    <h3>Tweaks · 调 参</h3>
    <div class="tweak-row">
      <label>配色主题</label>
      <div class="tweak-choices">
        <button data-theme="vintage">复古</button>
        <button data-theme="ink">水墨</button>
        <button data-theme="autumn">秋染</button>
      </div>
    </div>
  </div>

  <div class="map-stage" id="map-stage">
    <div class="map-wrap" id="map-wrap">
      <svg class="map-svg" id="map-svg" viewBox="0 -40 1000 840" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="map-loading" id="map-loading">
        <div class="ink-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="loading-text">边 界 装 载 中 …</div>
      </div>
    </div>
  </div>

  <div class="zoom-ctrl">
    <button id="zoom-in" title="放大">放</button>
    <div class="zoom-level" id="zoom-level">100%</div>
    <button id="zoom-out" title="缩小">收</button>
    <button id="zoom-reset" title="复位" class="reset">归</button>
  </div>

  <div class="info-card" id="info-card" style="display:none"></div>
  <div class="destination-card hidden" id="destination-card"></div>

  <div class="dart-layer" id="dart-layer"></div>

  <div class="dart-panel">
    <span class="seal-mark">朱</span>
    <button class="dart-btn" id="fire-dart">掷 签 问 地</button>
    <button class="dart-btn" id="continuous-fire">一 签 到 底</button>
    <button class="dart-btn secondary" id="stop-fire" disabled>收 手</button>
    <button class="dart-btn secondary" id="clear-darts">拾 签</button>
  </div>

  <script src="data/statistical-regions.js"></script>
  <script src="data/boundary-manifest.js"></script>
  <script src="data/destinations.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
